name: Oracle Free Tier A1 (upgrade hourly)

on:
  schedule:
    # Uma vez por hora, fora do minuto zero para reduzir atrasos do scheduler.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: oracle-a1-claim
  cancel-in-progress: false

jobs:
  criar-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_COMPARTMENT_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_SUBNET_OCID: ${{ secrets.OCI_SUBNET_OCID }}
      OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Dependencias
        run: pip install -r requirements.txt
      - name: Criar ou tentar ampliar Oracle A1 Free Tier
        id: tentativa
        run: python create_vm.py
      - name: Desativar verificacoes ao atingir 2 OCPUs e 12 GB
        if: ${{ steps.tentativa.outputs.status == 'created_primary' || steps.tentativa.outputs.status == 'upgraded' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/oracle-a1.yml/disable"
          echo 'Configuração 2 OCPUs/12 GB atingida. Agendamento desativado.'

      - name: Marcar falta de capacidade como falha
        if: ${{ always() && (steps.tentativa.outputs.status == 'unavailable' || steps.tentativa.outputs.status == 'upgrade_unavailable') }}
        run: |
          echo 'A Oracle não aceitou a configuração 2 OCPUs/12 GB. A próxima execução horária tentará novamente.'
          exit 1
